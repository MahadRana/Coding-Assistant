services:
  backend:
    build:
      context: ./backend
    # Secrets (ANTHROPIC_API_KEY, TAVILY_API_KEY, LANGSMITH_API_KEY) come from
    # backend/.env rather than being baked into the image.
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      # Persist generated projects so they survive container restarts.
      - backend_workspace:/app/workspace
    healthcheck:
      # Python is guaranteed in the backend image (curl is not), so probe the
      # app with urllib. The frontend waits on this passing before it starts.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/docs').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        # Start the frontend only after the backend reports healthy, so the
        # nginx /run and /resume proxy has a live upstream from the first request.
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_workspace:
