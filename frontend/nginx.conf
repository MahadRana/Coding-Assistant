server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any non-asset route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the agent API to the backend service. These mirror the paths the
    # Vite dev server proxies during development (see vite.config.ts).
    location ~ ^/(run|resume)$ {
        # Defer upstream DNS to request time via Docker's embedded resolver, so
        # nginx doesn't hard-fail at boot if the backend isn't up yet and picks
        # up the backend's IP if its container restarts.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $upstream backend;
        proxy_pass http://$upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent runs can take minutes; the client uses a 300s timeout, so keep
        # the upstream read timeout in step to avoid premature 504s.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
